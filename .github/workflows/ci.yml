name: auth-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Tests
        run: pnpm exec jest --runInBand
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Build container
        run: docker build -t sky-ts-auth:ci .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-ts-auth:ci --format '{{.Config.User}}')" = "node"
